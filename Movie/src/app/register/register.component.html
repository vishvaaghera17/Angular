<header class="header">
  <h1>🎬 Movie Booking</h1>
  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/login">Login</a>
  </nav>
</header>

<div class="register-page">
  <div class="register-container">
    <h2>REGISTER</h2>
    <input type="text"     placeholder="Full Name"     [(ngModel)]="user.name">
    <input type="email"    placeholder="Email Address" [(ngModel)]="user.email">
    <input type="tel"      placeholder="Phone Number"  [(ngModel)]="user.phone">
    <input type="password" placeholder="Password"      [(ngModel)]="user.password">
    <button (click)="register()">Create Account</button>
    <div class="login-link">
      Already have an account? <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
